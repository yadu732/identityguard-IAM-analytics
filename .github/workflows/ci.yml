name: Python CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test tooling
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check src tests app.py
      - name: Validate CLI on bundled data
        run: python -m identityguard.cli analyze --data-dir data --out-dir reports --as-of 2026-11-18
